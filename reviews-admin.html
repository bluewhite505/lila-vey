<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Moderation — Lila Vey</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
:root{--paper:#eee2cc;--ink:#1d1716;--muted:#73645f;--ox:#8f1720;--green:#345b3b;--rule:#c4b096}
*{box-sizing:border-box}body{margin:0;background:#151111;color:var(--ink);font-family:Arial,sans-serif}.paper{min-height:100vh;background:var(--paper)}.wrap{width:min(1120px,calc(100% - 28px));margin:auto;padding:34px 0 70px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--rule);padding-bottom:22px}.brand{font-weight:800;letter-spacing:3px;font-size:13px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.5px;margin-top:5px}h1{font-family:Georgia,serif;font-weight:500;font-size:42px;margin:34px 0 12px}.lede{color:var(--muted);line-height:1.55}.auth{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin:24px 0 18px}.auth input,select{border:1px solid #a58f76;background:#fff9ed;padding:12px;color:var(--ink);min-width:0}.btn{border:0;padding:12px 15px;background:#242020;color:#fff;font-weight:700;letter-spacing:.6px;cursor:pointer}.btn.red{background:var(--ox)}.btn.green{background:var(--green)}.btn.light{background:#e4d6be;color:#2a2220;border:1px solid #ad9a82}.toolbar{display:flex;gap:10px;align-items:center;margin:12px 0 22px;flex-wrap:wrap}.status{font-size:12px;color:var(--muted)}.grid{display:grid;gap:14px}.card{border:1px solid var(--rule);background:rgba(255,250,240,.63);padding:20px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-family:Georgia,serif;font-size:22px}.pill{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:6px 8px;border:1px solid var(--rule)}.pill.approved{background:#dce8d8;border-color:#88a181}.pill.rejected{background:#f2d7d4;border-color:#be8f8a}.pill.pending{background:#f2e6c8}.stars{color:var(--ox);margin:8px 0}.copy{font-family:Georgia,serif;font-size:18px;line-height:1.55;white-space:pre-wrap}.meta{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.warning{color:#8a1a22;font-weight:700}.empty{padding:28px;border:1px dashed #a58f76;color:var(--muted)}
@media(max-width:680px){.auth{grid-template-columns:1fr}.head{display:block}.pill{display:inline-block;margin-top:8px}}
</style>
</head>
<body><div class="paper"><main class="wrap">
<div class="top"><div class="brand">LILA VEY<small>PRIVATE REVIEW MODERATION</small></div><div class="status" id="connection">Locked</div></div>
<h1>Reader review archive</h1><p class="lede">Nothing becomes public until you press APPROVE. The admin key is kept only in this browser tab.</p>
<div class="auth"><input id="secret" type="password" autocomplete="off" placeholder="REVIEW_ADMIN_SECRET"><button class="btn" id="load">Unlock & load</button><button class="btn light" id="forget">Forget key</button></div>
<div class="toolbar"><label for="filter">Show:</label><select id="filter"><option value="all">All</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><button class="btn light" id="refresh">Refresh</button><span class="status" id="count"></span></div>
<div id="grid" class="grid"></div>
</main></div>
<script>
const WORKER="https://lila-vey-store.kmirtchmue.workers.dev";
const secret=document.getElementById('secret'),grid=document.getElementById('grid'),filter=document.getElementById('filter'),connection=document.getElementById('connection'),count=document.getElementById('count');
secret.value=sessionStorage.getItem('lila_review_admin')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function key(){return secret.value.trim()}
async function load(){if(!key()){alert('Enter REVIEW_ADMIN_SECRET first.');return}sessionStorage.setItem('lila_review_admin',key());connection.textContent='Loading…';grid.innerHTML='';try{const r=await fetch(WORKER+'/admin/reviews?status='+encodeURIComponent(filter.value),{headers:{Accept:'application/json',Authorization:'Bearer '+key()}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not load reviews.');connection.textContent='Unlocked';count.textContent=(d.reviews?.length||0)+' review(s)';render(d.reviews||[])}catch(e){connection.textContent='Locked';grid.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function render(items){if(!items.length){grid.innerHTML='<div class="empty">No reviews in this view.</div>';return}grid.innerHTML=items.map(r=>`<article class="card"><div class="head"><div><div class="name">${esc(r.displayName)}</div><div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div></div><span class="pill ${esc(r.status)}">${esc(r.status)}</span></div><div class="copy">${esc(r.review)}</div><div class="meta">${esc(r.couple)}<br>Submitted: ${esc(new Date(r.createdAt).toLocaleString())}<br>Permission to publish: <strong>${r.publishConsent?'YES':'NO'}</strong>${r.publishConsent?'':' <span class="warning">— cannot be approved</span>'}</div><div class="actions"><button class="btn green" onclick="setStatus('${r.id}','approved')" ${r.publishConsent?'':'disabled'}>APPROVE</button><button class="btn red" onclick="setStatus('${r.id}','rejected')">REJECT</button><button class="btn light" onclick="setStatus('${r.id}','pending')">RETURN TO PENDING</button></div></article>`).join('')}
async function setStatus(id,status){try{const r=await fetch(WORKER+'/admin/reviews/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json',Authorization:'Bearer '+key()},body:JSON.stringify({status})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Update failed.');await load()}catch(e){alert(e.message)}}
document.getElementById('load').onclick=load;document.getElementById('refresh').onclick=load;filter.onchange=load;document.getElementById('forget').onclick=()=>{sessionStorage.removeItem('lila_review_admin');secret.value='';grid.innerHTML='';connection.textContent='Locked';count.textContent=''};
if(secret.value) load();
</script>
</body></html>
